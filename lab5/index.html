<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Lab 5 Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">
    <div class="card">

        <div class="image-side">
            <img src="anime.png" alt="Anime girl">
        </div>

        <div class="content-side">
            <h1>Pixel Hunt Game</h1>

            <label for="difficulty">Оберіть складність:</label>
            <select id="difficulty">
                <option value="">-- Оберіть --</option>
                <option value="easy">Easy</option>
                <option value="normal">Normal</option>
                <option value="hard">Hard</option>
            </select>

            <label for="colorPicker">Оберіть колір квадрата:</label>
            <input type="color" id="colorPicker" value="#ff4fa3">

            <button id="startBtn">Start Game</button>

            <div class="info">
                <p>Score: <span id="score">0</span></p>
                <p>Time: <span id="time">0</span></p>
            </div>

            <div id="gameArea">
                <div id="target"></div>
            </div>

            <p id="message">Оберіть параметри і натисніть Start</p>
        </div>

    </div>
</div>

<script src="script.js"></script>
</body>
</html>
