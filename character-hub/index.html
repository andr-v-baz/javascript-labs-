<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Anime Character Hub</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/game.css">
</head>

<body id="top">

  <nav class="navbar">
    <div class="logo">
      <a href="#top">
        <img src="images/logo/logo.png" alt="Anime Character Hub logo">
      </a>
    </div>

    <button class="menu-toggle" id="menuToggle" aria-label="Open menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div class="nav-right" id="navRight">
      <ul class="menu" id="mobileMenu">
        <li><a href="#top">Home</a></li>
        <li><a href="#characters-section">Characters</a></li>
        <li><a href="#game">Game</a></li>
      </ul>

      <div id="greeting"></div>
    </div>
  </nav>

  <header class="header">
    <h1>Anime Character Hub</h1>
    <p>Explore popular anime characters and test your ninja skills!</p>
  </header>

  <div class="name-box">
    <div id="nameInputBox">
      <input type="text" id="usernameInput" placeholder="Enter your name">
      <button id="saveName">OK</button>
    </div>

    <button id="editNameBtn" style="display:none;">Change name</button>
  </div>

  <section class="search-section">
    <input type="text" id="searchInput" placeholder="Search character...">
  </section>

  <section class="categories-section">
    <h2>Anime Categories</h2>
    <div id="categories"></div>
  </section>

  <section class="characters-section" id="characters-section">
    <h2 id="characters-title">Characters</h2>
    <div id="characters"></div>
  </section>

  <section id="game">
    <h2>Ninja Dodge</h2>

    <div id="game-container">
      <div class="game-controls">
        <button id="startBtn">Start</button>
        <button id="pauseBtn">Pause</button>
        <button id="fullscreenBtn">Full screen</button>
      </div>

      <canvas id="gameCanvas" width="800" height="400"></canvas>

      <div class="mobile-controls">
        <button id="leftBtn">⬅</button>
        <button id="rightBtn">➡</button>
      </div>
    </div>
  </section>

  <footer>
    <p>Anime Character Hub © 2026</p>
    <p>Web Programming</p>
  </footer>

  <script src="js/fetchData.js"></script>
  <script src="js/search.js"></script>
  <script src="js/greeting.js"></script>
  <script src="js/game.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
